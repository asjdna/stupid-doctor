name: CI

# 三个作业，各管一件事：
#   · quality   静态检查 + 单元测试；带 pgvector service，需要真实 Postgres 的用例真跑
#   · pipeline  全链路自检：全量语料 + 确定性哈希向量（离线、快、不下载模型）
#   · gate      检索质量闸门：真实嵌入模型 + 与冻结基线同口径的索引，指标退化即失败
#
# 闸门必须单独一个作业：它比较的是冻结基线，而基线绑定了嵌入模型。
# pipeline 用哈希向量（模型名不同、向量空间不可比），在那里跑闸门会被正确地拒绝，
# 表现为"永远红"——红着的门没有人会再看，所以分成两步。
#
# 注意：不要在这里写死语料块数，它会随上游文档更新而变化。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 静态检查 + 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 起 Postgres service，让需要真实数据库的用例真正执行——否则它们会被跳过，
    # 而"跳过的测试"和"通过的测试"在日志里长得一样。
    # 用 `pytest -rs` 的汇总判断：数据库可达时不应出现 pgvector 那一族的 skip。
    # 镜像需自带 pg_search：关键字检索路用的是它的 BM25，缺了会退化为降级路径，
    # 那样这些用例测的就不是产品路径了。
    services:
      postgres:
        image: paradedb/paradedb:0.26.1-pg16
        env:
          POSTGRES_USER: kubedocs
          POSTGRES_PASSWORD: kubedocs
          POSTGRES_DB: kubedocs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kubedocs -d kubedocs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 与 Settings.database_url 的默认值同形，只把取值对齐到上面的 service。
      KUBEDOCS_DATABASE_URL: postgresql://kubedocs:kubedocs@127.0.0.1:5432/kubedocs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # 单元测试不加载模型、不访问网络：让反馈回路保持在秒级。
      # 不要叠加第二个 `-q`（pyproject 的 addopts 里已有一个），两个叠起来会吞掉汇总行。
      # `-rs` 让每条 skip 的原因进日志；可接受的 skip 只有 milvus 那一族
      # （`pymilvus` / `milvus-lite` 是可选依赖，CI 不装）。
      - name: 单元测试（含需要真实 Postgres 的用例）
        run: pytest tests/unit -p no:cacheprovider -rs
      - name: ruff（阻塞）
        run: ruff check .
      # 两道独立的门：`ruff check` 管规则，`ruff format --check` 管排版。
      # 行尾由 pyproject 的 `[tool.ruff.format]` 定死，保证不同平台判定一致。
      - name: ruff format --check（阻塞）
        run: ruff format --check .
      - name: mypy（阻塞）
        run: mypy src scripts
      # 文档里的 `文件:行号` 引用必须指向它自己声称的内容，而不只是"文件存在、行号不越界"。
      # 脚本做内容级校验；机器判断不了的引用逐条登记在脚本内的白名单里。
      - name: 文档锚点校验（阻塞）
        run: python scripts/check_doc_refs.py

      # `src/` 里直接 import 的第三方包必须都写进 pyproject。
      # 这类问题在本机开发环境看不出来（包可能是靠传递依赖凑巧装上的），
      # 只有装到干净环境（容器 / CI）才会暴露。
      - name: 依赖声明校验（阻塞）
        run: python scripts/check_deps.py

  pipeline:
    name: 全链路自检（全量语料 + 哈希向量，不下载模型）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality]
    env:
      # `KUBEDOCS_ENV: ci` 曾在这里，但那个字段没有任何行为读它（假开关，已从 config.py 删掉）。
      KUBEDOCS_EMBEDDING_PROVIDER: hashing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: 拉官方语料
        run: python scripts/fetch_corpus.py

      - name: 摄取（切块 + 向量 + FTS 索引）
        run: python -m kubedocs.cli ingest

      - name: 索引体检（含 FTS 一致性自检）
        # 外内容表删除顺序写错时，索引会永久不一致；这一步专门抓它
        run: python -m kubedocs.cli stats --verify

      - name: 标注集预检（对原始语料）
        run: python scripts/check_gold.py

      - name: 评测流程自检（不卡质量闸门，只用退出码验证链路）
        # 退出码 3 = 标注集/索引不合法；能跑到 0 说明自检、指标、引用完整性都通了。
        # 注意哈希向量的分数**不代表检索质量**，不要把它当质量结论。
        # **不要在这里加 `--gate`**：hashing 的模型名与冻结基线绑定
        # `BAAI/bge-small-en-v1.5` 不可比，闸门会（正确地）拒绝比较并退出 2 ——
        # 加在这里等于让 CI 永远红。真正的闸门见下面的 gate job，文件顶部的注释有实测数据。
        run: python -m kubedocs.cli eval --top-k 10

  gate:
    name: 检索质量闸门（真实模型 + 冻结基线）
    runs-on: ubuntu-latest
    needs: [quality]
    # 缓存未命中时要装 torch、下 bge-small、真的把上万块全部编码（本机 i7-13700H 实测
    # 全量摄取约 35 分钟，见 README「实测数字」/ ADR-0002）；runner 更慢，所以给足上限。
    # 命中缓存后这一步只剩评测本身（分钟级）。
    # ⚠️ 这里**故意不写死块数**：它随上游语料变动（2026-10-14 实测 18811 → 18822）。
    timeout-minutes: 120
    env:
      # 冻结基线绑定的是真实嵌入模型；hashing 的分数与它不可比（见文件顶部注释）。
      KUBEDOCS_EMBEDDING_PROVIDER: bge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: 缓存嵌入模型权重（bge-small-en-v1.5，约 130MB）
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-small-en-v1.5

      # 语料与索引一起缓存、共用同一个键：它们共同构成"冻结基线口径"的可复现载体。
      # 键里只放切块、嵌入与标注集——不放 retrieve/ 与 store/，因为那两处正是闸门要守的东西，
      # 放进去会让缓存每次都失效，等于用缓存把闸门绕过去。
      - name: 缓存语料与真实索引
        id: idx
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/index
          key: kd-gate-${{ runner.os }}-bge-small-en-v1.5-${{ hashFiles('src/kubedocs/chunker.py', 'src/kubedocs/embed.py', 'data/eval/retrieval_gold.jsonl') }}

      - name: 拉官方语料（缓存未命中时）
        if: steps.idx.outputs.cache-hit != 'true'
        run: python scripts/fetch_corpus.py

      - name: 摄取真实索引（缓存未命中时；本机实测约 35 分钟）
        if: steps.idx.outputs.cache-hit != 'true'
        run: python -m kubedocs.cli ingest --rebuild

      - name: 标注集预检（对原始语料）
        run: python scripts/check_gold.py

      # 这里不把索引灌进 pgvector：那要给本作业再起一条 Postgres service，
      # 且每次都要重灌上万块，而它验证的是镜像完整性，与质量闸门无关。
      # pgvector 后端的契约已由 quality 作业里那一族用例覆盖。
      - name: 质量闸门（指标退化 → 退出码 2 → CI 红）
        # 比对 hit@10 / mrr@10（容差各 0.02），并拒绝跨标注集、跨模型、跨语料的比较：
        # 语料身份由 `corpus_sha` 精确判定，逃生口是 `--allow-corpus-drift`。
        # 缺少必需字段的基线一样退出码 2——缺字段不等于"不用比"。
        run: python -m kubedocs.cli eval --top-k 10 --gate
