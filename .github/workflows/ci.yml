name: CI

# 工业项目的 CI 应当回答两个问题：
# 1) "换个干净环境还能装起来并跑通吗" —— 装依赖走 pyproject，在 ubuntu 上跑
# 2) "改动有没有让质量下降" —— lint/type/test/管道自检全部**阻塞**（非零码即失败）
#
# 关于"质量闸门"为什么不在 CI 里跑（见 docs/adr/0002）：
#   `cli eval --gate` 比较的是**冻结基线**，而基线绑定了三样东西——标注集哈希、
#   嵌入模型、索引块数。CI 每次都从 GitHub 重新拉官方文档，上游文档一变块数就变，
#   闸门会（正确地）拒绝比较。所以：
#     · CI 跑"管道自检"：全量语料 + 确定性哈希向量（离线、快、不下载模型），
#       验证 摄取 → FTS 一致性 → 标注集自检 → 指标 → 引用完整性 整条链路不坏；
#     · 真实模型的质量闸门是**发版前的本地/手动步骤**（README「快速开始」第 5 步）。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 静态检查 + 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # 单元测试**不需要**数据库、模型与网络：这是刻意的设计（纯函数 + 依赖注入），
      # 让反馈回路保持在秒级。需要真实模型的评测见下面的 pipeline job 与 README。
      # **不要再叠加 `-q`**：pyproject 的 addopts 里已经有一个 `-q`，两个叠成 `-qq`
      # 会把 "N passed" 汇总行一起吞掉（CI 日志里就看不到实际通过数了）。
      # `-p no:cacheprovider` 与 `make test`、CONTRIBUTING.md 的命令保持一致（CI 不需要缓存）。
      - name: 单元测试（零依赖、秒级）
        run: pytest tests/unit -p no:cacheprovider
      - name: ruff（阻塞）
        run: ruff check .
      - name: mypy（阻塞）
        run: mypy src scripts

  pipeline:
    name: 全链路自检（全量语料 + 哈希向量，不下载模型）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality]
    env:
      KUBEDOCS_ENV: ci
      KUBEDOCS_EMBEDDING_PROVIDER: hashing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: 拉官方语料
        run: python scripts/fetch_corpus.py

      - name: 摄取（切块 + 向量 + FTS 索引）
        run: python -m kubedocs.cli ingest

      - name: 索引体检（含 FTS 一致性自检）
        # 外内容表删除顺序写错时，索引会永久不一致；这一步专门抓它
        run: python -m kubedocs.cli stats --verify

      - name: 标注集预检（对原始语料）
        run: python scripts/check_gold.py

      - name: 评测流程自检（不卡质量闸门，只用退出码验证链路）
        # 退出码 3 = 标注集/索引不合法；能跑到 0 说明自检、指标、引用完整性都通了。
        # 注意哈希向量的分数**不代表检索质量**，不要把它当质量结论。
        run: python -m kubedocs.cli eval --top-k 10
