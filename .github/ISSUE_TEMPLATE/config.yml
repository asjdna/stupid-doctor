# Issue 模板配置。https://docs.github.com/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository
#
# 关掉"空白 issue"：这个项目需要的信息（域、Python 版本、有没有跑过 ingest、
# 门禁输出、有没有配密钥）几乎每次都要问一遍，直接让模板问了更省事。
blank_issues_enabled: false

# 这里**刻意没有** contact_links。
# 常规做法是加一条"安全问题请走 Security Advisories"的链接，但 contact_links 需要
# 一个写死的绝对 URL，而本仓库当前**没有 remote**（`git remote -v` 为空），
# 写任何 URL 都是在编一个不存在的地址。安全上报渠道见仓库根目录的 SECURITY.md
# （GitHub Private vulnerability reporting，在仓库的 Security 标签页下）。
# 等这个仓库托到某个真实地址之后，在这里补 contact_links 才是诚实的做法。
