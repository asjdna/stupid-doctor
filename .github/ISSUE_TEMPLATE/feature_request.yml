name: ✨ 功能建议
description: 建议一个新能力或一处改进（检索、评测、Agent、可观测、clinic 域等）
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > 安全问题请通过 `Security` → `Advisories` 私密上报，不要走这里（见 [SECURITY.md](../../SECURITY.md)）。

  - type: textarea
    id: problem
    attributes:
      label: 你要解决什么问题
      description: 先讲问题、再讲方案。"谁在什么场景下被卡住了"比"加一个模块"有用得多。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
      description: 涉及新依赖或新服务时，请说明为什么现成件不够用（默认取向是先用成熟件）。
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及哪一块
      options:
        - 检索（召回 / 融合 / 重排）
        - 回答与引用
        - 评测与闸门
        - Agent 内核与工具
        - clinic 域（问诊 / 分诊 / 挂号）
        - API / 服务化 / 前端
        - 可观测与成本
        - 工程脚手架（CI / Docker / 依赖）
        - 文档
        - 其它
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 怎么判断它有效（可选，但很有说服力）
      description: |
        一个可先失败、后变好的指标（hit@k / MRR / 分诊命中率 / p95 延迟 / 成本），
        或一段真实失败案例，都比论证更有用。还没有证据就写"暂无证据"，写明即可。
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我没有在这里贴任何 API key、`.env` 内容或凭据
          required: true
