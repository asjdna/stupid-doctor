name: 🐛 Bug 报告
description: 报告一个可复现的问题（检索、回答、分诊、评测闸门、CLI、API、Agent 循环等）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > **安全漏洞请不要走这里。** 请通过仓库 `Security` → `Advisories` →
        > `Report a vulnerability` 私密上报（见 [SECURITY.md](../../SECURITY.md)）。
        >
        > **不要贴 API key、`.env` 内容或任何凭据。** 贴日志前先删掉相关行。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 期望结果 vs 实际结果。有报错请贴完整 traceback（去掉密钥）。
      placeholder: |
        期望：...
        实际：...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 越具体越好（完整命令与参数）。
      placeholder: |
        1. python -m kubedocs.cli --domain clinic ingest
        2. python -m kubedocs.cli search "..." --explain
        3. 看到 ...
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: 哪个域
      description: 两个域的语料与归一化器不同，这一步常能直接定位问题。
      options:
        - k8s_docs（Kubernetes 官方文档）
        - clinic（医疗问诊 / 挂号）
        - 两个域都涉及
        - 不确定 / 还没到域的层面
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 环境
      description: Python 版本、操作系统、向量后端（`KUBEDOCS_STORE`），以及是否跑过 ingest。
      render: text
      placeholder: |
        Python 3.10.10 / Windows 11 / KUBEDOCS_STORE=sqlite-vec
        跑过全量 ingest（bge 嵌入）
    validations:
      required: true

  - type: textarea
    id: stats
    attributes:
      label: 索引体检输出（`python -m kubedocs.cli stats --verify`）
      description: 如果建过索引，请贴这一步的输出。
      render: text
      placeholder: |
        n_chunks=... embedding_model=... FTS 一致性自检: ok
    validations:
      required: false

  - type: textarea
    id: gate-output
    attributes:
      label: 检查命令的输出
      description: |
        `python scripts/ci_local.py`，或分开跑：
        `python -m ruff check .` / `python -m mypy src scripts` / `python -m pytest tests/unit`
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 上面贴出的内容里没有 API key、`.env` 内容或任何凭据
          required: true
