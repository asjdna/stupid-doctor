# Dependabot：每周检查依赖更新。
#
# ⚠ 它只看得懂 pyproject.toml，**不维护 requirements.lock.txt**：
#   Dependabot 提的 PR 合并之后，必须由人手动重跑 `make lock`（或
#   `python scripts/gen_lock.py`），否则锁文件会静默漂移到旧版本。
#   只查漂移、不写文件：`python scripts/gen_lock.py --check`（有漂移退出码 1）。
version: 2

updates:
  # ---------- Python 依赖（读 pyproject.toml 的 [project] 与 optional 组） ----------
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    # 这里刻意**不设** `ignore`：合不合由人判断，工具不该替维护者决定。
    # major 升级（尤其 langgraph / litellm，被 agent 内核直接依赖）请当成一次
    # 真实变更来做——跑 `make check`，并跑一次真实模型的评测闸门。

  # ---------- GitHub Actions ----------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
