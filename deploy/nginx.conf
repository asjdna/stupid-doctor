# kubedocs 网关：**唯一对外入口** + sticky session + SSE 支持。
#
# 挂载点见 docker-compose.yml 的 `nginx` 服务（`:ro` 只读）：
#     ./deploy/nginx.conf -> /etc/nginx/nginx.conf
#
# 为什么需要这一层（三件事，缺一不可）：
#   1. **sticky**：`/consult` 的待确认挂号单仍在进程内（`DECISIONS` 第 15 条：一次性提议），
#      多副本下"在 A 提议、在 B 确认"必然 404/409。会话状态（实体槽位与对话上文）已经落
#      `clinical.sessions`，所以**只有待确认单需要粘性**——但它是挂号流程的必要一环。
#   2. **SSE 不能缓冲**：`/chat` 返回 `text/event-stream`（`EventSourceResponse`）。
#      nginx 默认开 proxy_buffering，会把事件攒到连接结束再一起发，"边跑边推"变成
#      "跑完才看到一屏"。这里显式关掉。
#   3. **读超时要放大**：一轮问诊是模型在跑（工具循环可能几次往返），默认 60s 会掐断长回答。
#
# 副本数怎么改：`docker compose up -d --scale api=3`（api 服务不再占宿主端口，
# 由本网关统一暴露 8080）。后端地址随之变化，所以下面必须用 `resolve` 动态解析，
# 而不是启动时解析一次就固定住。

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # 访问日志里直接给出"这一轮落到哪个副本"（`upstream=`）和"粘性用的键"：
    # sticky 到底有没有生效，看这一列即可，不必猜。
    log_format  upstream  '$remote_addr [$time_local] "$request" $status '
                          'rt=$request_time upstream=$upstream_addr '
                          'sticky_ip=$remote_addr sticky_sid=$cookie_kubedocs_sid';
    access_log  /var/log/nginx/access.log  upstream;

    # Docker 内置 DNS。`--scale api=N` 之后副本地址会变，必须动态解析；
    # `resolve` 需要 nginx >= 1.27.3，因此镜像钉 `nginx:1.27-alpine`（不是 latest）。
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream kubedocs_api {
        # `resolve` 与粘性都要共享内存区（存对端列表与哈希环）。
        zone kubedocs_api 64k;

        # ---------------- 粘性策略 ----------------
        # **默认：优先按会话 cookie，没有 cookie 就退回按 IP。**
        # 键 = `kubedocs_sid`（问诊页在生成 session_id 时自动写入的同源 cookie）+ `$remote_addr`：
        #   · 浏览器带了 cookie ⇒ 同一**会话**钉在同一副本（同一 NAT 后面的人也能各钉各的）；
        #   · curl / 脚本没有 cookie ⇒ 键退化成纯 IP，行为与 ip_hash 一致，不会全挤到一台。
        # 为什么要有 cookie 这一档：待确认挂号单在服务端**进程内**（一次性提议，
        # `DECISIONS` 第 15 条），多副本下"在 A 提议、在 B 确认"必然失败。
        #
        # ⚠ **这里不能用 `consistent`**（实测）：`hash ... consistent` 与 `resolve`
        #   （动态解析 `--scale` 出来的副本）不兼容——DNS 解析出的多个副本在一致性哈希环上
        #   同名同端口（都是 `api:8080`），环点重复，于是退化成轮询：同一个 cookie 的请求
        #   会在副本之间来回跳。去掉 `consistent`（普通取模哈希）后实测稳定：
        #   同一 session_id 3/3 命中同一副本，不同 session_id 分布到不同副本。
        #   代价：**扩缩容会让部分会话重新映射**（模数变了）。可接受——待确认单只有 15 分钟，
        #   真赶上了，患者重新说一句"帮我挂号"即可；会话状态本身在库里，不受影响。
        hash "$cookie_kubedocs_sid$remote_addr";

        # 只按 IP 粘（不依赖任何前端改动，最省事；同一 NAT 后面的人会共用一台，
        # 前面还有一层反向代理时先配 real_ip 把真实 IP 取回来）。二选一，不要同时开：
        # ip_hash;

        # 只按会话粘（**没有 cookie 的客户端会全部落到同一台**，脚本/探针要留意）：
        # hash $cookie_kubedocs_sid;

        # 后端地址用 compose 的服务名：缩容/扩容后由 `resolve` 重新拉取。
        server api:8080 resolve max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        proxy_connect_timeout 5s;
        # 问诊一轮可能几十秒；给足余量，宁可等也不要掐断
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        client_max_body_size  20m;

        location / {
            proxy_pass http://kubedocs_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            # **SSE 必需**：/chat 是 EventSourceResponse，缓冲会把事件攒到最后
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
