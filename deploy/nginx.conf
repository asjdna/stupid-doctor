# kubedocs 网关：**唯一对外入口** + sticky session + SSE 支持。
#
# 挂载点见 docker-compose.yml 的 `nginx` 服务（`:ro` 只读）：
#     ./deploy/nginx.conf -> /etc/nginx/nginx.conf
#
# 为什么需要这一层（三件事，缺一不可）：
#   1. **sticky**：`/consult` 的待确认挂号单仍在进程内（`DECISIONS` 第 15 条：一次性提议），
#      多副本下"在 A 提议、在 B 确认"必然 404/409。会话状态（实体槽位与对话上文）已经落
#      `clinical.sessions`，所以**只有待确认单需要粘性**——但它是挂号流程的必要一环。
#   2. **SSE 不能缓冲**：`/chat` 返回 `text/event-stream`（`EventSourceResponse`）。
#      nginx 默认开 proxy_buffering，会把事件攒到连接结束再一起发，"边跑边推"变成
#      "跑完才看到一屏"。这里显式关掉。
#   3. **读超时要放大**：一轮问诊是模型在跑（工具循环可能几次往返），默认 60s 会掐断长回答。
#
# 副本数怎么改：`docker compose up -d --scale api=3`（api 服务不再占宿主端口，
# 由本网关统一暴露 8080）。后端地址随之变化，所以下面必须用 `resolve` 动态解析，
# 而不是启动时解析一次就固定住。

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # 访问日志里直接给出"这一轮落到哪个副本"（`upstream=`）和"粘性用的键"：
    # sticky 到底有没有生效，看这一列即可，不必猜。
    log_format  upstream  '$remote_addr [$time_local] "$request" $status '
                          'rt=$request_time upstream=$upstream_addr '
                          'sticky_ip=$remote_addr sticky_sid=$cookie_kubedocs_sid';
    access_log  /var/log/nginx/access.log  upstream;

    # Docker 内置 DNS。`--scale api=N` 之后副本地址会变，必须动态解析；
    # `resolve` 需要 nginx >= 1.27.3，因此镜像钉 `nginx:1.27-alpine`（不是 latest）。
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream kubedocs_api {
        # `resolve` 与粘性都要共享内存区（存对端列表与哈希环）。
        zone kubedocs_api 64k;

        # ---------------- 粘性策略（二选一，默认 ①）----------------
        # ① 按**客户端 IP**：零改动、最省事。同一 NAT / 代理后面的用户会共用一台，
        #    如果前面还有一层反向代理，先用 real_ip 模块把真实 IP 取回来。
        ip_hash;

        # ② 按**会话**粘：前端把 session_id 同时写进同源 cookie `kubedocs_sid`，
        #    然后用下面这行替换 `ip_hash`（两者不能同时开）。
        #    好处：同一 NAT 后面的人也能各自粘到自己的副本。
        # hash $cookie_kubedocs_sid consistent;

        # 后端地址用 compose 的服务名：缩容/扩容后由 `resolve` 重新拉取。
        server api:8080 resolve max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        proxy_connect_timeout 5s;
        # 问诊一轮可能几十秒；给足余量，宁可等也不要掐断
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        client_max_body_size  20m;

        location / {
            proxy_pass http://kubedocs_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            # **SSE 必需**：/chat 是 EventSourceResponse，缓冲会把事件攒到最后
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
