<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在线问诊</title>
<style>
  :root {
    --bg:#0b1220; --panel:#131c2e; --panel2:#1b2740; --line:#2a3a58;
    --fg:#e8eefc; --dim:#93a4c4; --accent:#4f8cff; --bad:#f04d4d;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; }
  header { padding:12px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:16px; }
  header .sub { color:var(--dim); font-size:12px; }
  header .spacer { flex:1; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--dim);
    border-radius:8px; padding:5px 12px; font:inherit; font-size:13px; cursor:pointer; }

  /* 急诊横幅：**只在模型判出紧急时**由脚本加上 .show */
  #emg { display:none; }
  #emg.show { display:block; background:#3a1111; border-bottom:1px solid var(--bad);
    padding:14px 20px; }
  #emg .t { color:#ffb4b4; font-weight:700; font-size:16px; margin-bottom:4px; }
  #emg .n { color:#ffd9d9; }

  #log { flex:1; overflow-y:auto; padding:20px; }
  .inner { max-width:760px; margin:0 auto; }
  .msg { margin-bottom:16px; display:flex; }
  .msg .bubble { padding:11px 15px; border-radius:12px; white-space:pre-wrap;
    word-break:break-word; max-width:88%; }
  .msg.me { justify-content:flex-end; }
  .msg.me .bubble { background:#22355a; border-bottom-right-radius:4px; }
  .msg.sys .bubble { background:var(--panel); border:1px solid var(--line);
    border-bottom-left-radius:4px; }
  .msg.note .bubble { background:#2a2410; border:1px solid #5c4a1a; color:#ffe6a8;
    font-size:13px; max-width:100%; }
  .msg.thinking .bubble { color:var(--dim); font-style:italic; }

  footer { border-top:1px solid var(--line); padding:12px 20px 16px; }
  form { max-width:760px; margin:0 auto; display:flex; gap:8px; align-items:flex-end; }
  textarea { flex:1; background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:10px; padding:10px 13px; font:inherit; resize:none; min-height:50px;
    max-height:160px; }
  textarea:focus { outline:none; border-color:var(--accent); }
  button.send { background:var(--accent); color:#fff; border:0; border-radius:10px;
    padding:13px 22px; font:inherit; font-weight:600; cursor:pointer; }
  button.send:disabled { opacity:.5; cursor:not-allowed; }
  .hint { max-width:760px; margin:8px auto 0; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>在线问诊</h1>
  <span class="sub">用您自己的话描述症状即可</span>
  <span class="spacer"></span>
  <span class="sub" id="sid"></span>
  <button class="ghost" id="reset" type="button">重新开始</button>
</header>

<div id="emg">
  <div class="t">⚠️ 请立即就医</div>
  <div class="n" id="emgtext"></div>
</div>

<div id="log"><div class="inner" id="stream"></div></div>

<footer>
  <form id="f">
    <textarea id="q" rows="2" placeholder="例如：这两天老咳嗽，还有点低烧，痰是黄的" autofocus></textarea>
    <button class="send" id="send" type="submit">发送</button>
  </form>
  <div class="hint">按 Enter 发送，Shift+Enter 换行</div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const SID_KEY = "kubedocs.consult.sid";
let sid = sessionStorage.getItem(SID_KEY);
if (!sid) {
  sid = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()).slice(0, 36);
  sessionStorage.setItem(SID_KEY, sid);
}
$("sid").textContent = "会话 " + sid.slice(0, 8);

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function addMsg(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + (cls || "sys");
  d.innerHTML = '<div class="bubble">' + esc(text) + "</div>";
  $("stream").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
  return d;
}

/* 开场白（免责声明）从服务端取，避免在页面里写第二份 */
fetch("/consult/status").then((r) => r.json()).then((s) => {
  addMsg("您好，请用您自己的话描述不舒服的地方。系统会先问 1~2 个关键问题，"
    + "再告诉您大概该挂哪个科、可能需要做哪些检查。", "sys");
  if (s.disclaimer) addMsg(s.disclaimer, "note");
}).catch(() => {
  addMsg("您好，请描述您的不舒服。", "sys");
});

async function send(text) {
  $("send").disabled = true;
  addMsg(text, "me");
  const wait = addMsg("正在整理…", "sys thinking");
  try {
    const r = await fetch("/consult", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: text, session_id: sid }),
    });
    wait.remove();
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      addMsg("（系统）请求失败 HTTP " + r.status + "：" + (d.detail || r.statusText), "note");
      return;
    }
    const p = await r.json();
    // 急诊横幅：**只认服务端给的 p.emergency**，它等于"模型这一轮判出紧急"。
    // 客户端不自己判红线和 urgent，两处判断早晚会不一致。
    if (p.emergency) {
      $("emgtext").textContent = p.emergency_note || "请立即拨打 120 或前往急诊科。";
      $("emg").classList.add("show");
    }
    if (p.degraded) {
      addMsg("（系统）这次没能连上大模型（" + p.degraded + "），下面是兜底提示，仅供参考。", "note");
    }
    // 结构化字段（科室/病症/检查/用药）不在这渲染——它们已在正文里由模型讲出来
    addMsg(p.message, "sys");
  } catch (e) {
    wait.remove();
    addMsg("（系统）网络错误：" + e, "note");
  } finally {
    $("send").disabled = false;
    $("q").focus();
  }
}

$("f").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const v = $("q").value.trim();
  if (!v) return;
  $("q").value = "";
  $("q").style.height = "auto";
  send(v);
});
$("q").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey) {
    ev.preventDefault();
    $("f").requestSubmit();
  }
});
$("q").addEventListener("input", () => {
  $("q").style.height = "auto";
  $("q").style.height = Math.min($("q").scrollHeight, 160) + "px";
});
$("reset").addEventListener("click", async () => {
  await fetch("/consult/reset", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sid }),
  }).catch(() => {});
  $("stream").innerHTML = "";
  $("emg").classList.remove("show");
  addMsg("已重新开始，请重新描述症状。", "sys");
  $("q").focus();
});
</script>
</body>
</html>
