<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>在线问诊 · 症状导诊与挂号</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%233fb950'/%3E%3C/svg%3E">
<style>
  /* 与 index.html / console.html 共用设计令牌：三个页面视觉上是一家的。
     患者端不做另一套亮色主题——代价是翻倍维护，收益只是"看起来不同"。 */
  :root {
    --bg: #0f1419;
    --panel: #171d24;
    --panel-2: #1e262f;
    --line: #2b3542;
    --fg: #e6edf3;
    --fg-dim: #9aa7b4;
    --fg-mute: #6e7b8a;
    --accent: #4c9aff;
    --accent-soft: #1d3a5c;
    --ok: #3fb950;
    --warn: #d29922;
    --err: #f85149;
    --mono: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;
    --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", Roboto, sans-serif;
    font-size: 16px;              /* 患者端放大一档：默认 14px 在手机上偏小 */
    line-height: 1.65;
    display: flex; flex-direction: column;
    height: 100dvh;               /* 用 dvh：手机浏览器地址栏收起时不跳 */
  }
  a { color: var(--accent); }

  /* ---------------------------------------------------------------- 顶栏 */
  header {
    flex: none; display: flex; align-items: center; gap: 12px;
    padding: 12px 16px calc(12px + env(safe-area-inset-top)) 16px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 600; font-size: 17px; }
  .brand span { display: block; font-weight: 400; font-size: 12px; color: var(--fg-mute); }
  .spacer { flex: 1 1 auto; }
  button {
    font-family: inherit; font-size: 15px; cursor: pointer;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--fg);
    padding: 10px 16px; min-height: 44px;              /* 触摸目标 ≥44px */
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent-soft); border-color: #2f5c92; color: #cfe4ff; }
  button.ghost { background: transparent; color: var(--fg-dim); }

  /* ---------------------------------------------------------------- 免责与急诊 */
  .notice {
    flex: none; padding: 10px 16px; font-size: 13px; color: var(--fg-dim);
    background: #12181f; border-bottom: 1px solid var(--line);
  }
  #emergency {
    flex: none; display: none; padding: 14px 16px; font-size: 15px;
    background: #3a1614; border-bottom: 1px solid #7a2b26; color: #ffd9d6;
  }
  #emergency.show { display: block; }
  #emergency b { font-size: 17px; }
  #emergency a { color: #ffd9d6; font-weight: 600; }

  /* ---------------------------------------------------------------- 对话区 */
  main {
    flex: 1 1 auto; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 14px;
    scroll-behavior: smooth;
  }
  .row { display: flex; }
  .row.me { justify-content: flex-end; }
  .bubble {
    max-width: min(78%, 34rem); padding: 12px 14px; border-radius: var(--radius);
    white-space: pre-wrap; word-break: break-word;
  }
  .me .bubble { background: var(--accent-soft); border: 1px solid #2f5c92; }
  .agent .bubble { background: var(--panel-2); border: 1px solid var(--line); }
  /* 急诊回答必须与普通回答**一眼可分**：这是安全关键路径，不是样式偏好。 */
  .agent.emergency .bubble {
    background: #3a1614; border-color: #7a2b26; color: #ffd9d6;
  }
  .agent .who { font-size: 12px; color: var(--fg-mute); margin-bottom: 4px; }
  .cites { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--fg-dim); }
  .cites div { margin-top: 2px; }
  .status { font-size: 13px; color: var(--fg-mute); display: flex; align-items: center; gap: 8px; }
  .dots::after {
    content: "…"; animation: blink 1.2s steps(4, end) infinite;
  }
  @keyframes blink { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  .hint-answer {
    font-size: 14px; color: #f3d99a; background: #302714;
    border: 1px solid #6b5420; border-radius: 10px; padding: 8px 12px; display: none;
  }
  .hint-answer.show { display: block; }

  /* ---------------------------------------------------------------- 输入区 */
  footer {
    flex: none; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)) 16px;
    background: var(--panel); border-top: 1px solid var(--line);
  }
  .composer { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1 1 auto; resize: none; min-height: 48px; max-height: 40vh;
    padding: 12px 14px; font-family: inherit; font-size: 16px; line-height: 1.5;
    color: var(--fg); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: var(--radius); outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .composer-tip { margin-top: 6px; font-size: 12px; color: var(--fg-mute); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>

<header>
  <div class="brand">在线问诊<span>症状导诊 · 科室建议 · 号源预约</span></div>
  <div class="spacer"></div>
  <button class="ghost" id="btnNew" type="button">新会话</button>
</header>

<div class="notice">
  本服务只做就医指引与挂号，<b>不能替代医生诊断</b>。情况紧急请直接拨打
  <a href="tel:120">120</a> 或前往最近的急诊。
</div>

<div id="emergency" role="alert" aria-live="assertive">
  <b>请立即就医</b><br>
  你描述的情况可能比较紧急。请拨打 <a href="tel:120">120</a>，或立刻前往最近的急诊科。
  在等待或前往途中，如症状加重请让身边的人协助。
</div>

<main id="messages" aria-live="polite" aria-relevant="additions text">
  <!-- 开场白由脚本插入，保证与后续回答同一套渲染路径 -->
</main>

<footer>
  <div class="hint-answer" id="hintAnswer">请先回答上面的问题，我再继续帮你判断。</div>
  <div class="composer" style="margin-top:8px">
    <textarea id="input" rows="1" placeholder="请描述你的症状，例如：这两天咳嗽，晚上有点喘"
              aria-label="描述症状" enterkeyhint="send"></textarea>
    <button class="primary" id="btnSend" type="button">发送</button>
    <button class="ghost" id="btnStop" type="button" disabled>停止</button>
  </div>
  <div class="composer-tip">Enter 发送 · Shift+Enter 换行</div>
</footer>

<script>
(function () {
  'use strict';
  var GREETING = '你好，我是导诊助手。请说说你哪里不舒服——我会先判断有没有需要立刻就医的情况，' +
                 '再帮你看看该挂哪个科。';

  /* 工具名 -> 给患者看的话。**不暴露内部工具名**：患者不需要知道我们在调什么，
     但"正在做什么"能显著降低等待焦虑，所以做一层人话映射。
     映射表里没有的工具名一律显示为通用文案（不要回显原始名字）。 */
  var TOOL_TEXT = {
    check_red_line: '正在判断是否有需要立刻就医的情况',
    list_departments: '正在查询可挂的科室',
    get_availability: '正在查询号源',
    book_appointment: '正在为你预约',
    check_citations: '正在核对依据',
  };
  var GENERIC_TOOL_TEXT = '正在处理';

  var $ = function (id) { return document.getElementById(id); };
  var msgs = $('messages');
  var input = $('input');
  var ctrl = null;
  var threadId = null;

  /* 会话标识只放 sessionStorage：关掉标签页就没了。
     放 localStorage 会在这台设备上留一份长期可追踪的标识——本项目没有认证、
     也没有告知与同意流程，所以**不**做那种默认。 */
  function patientId() {
    var k = 'kubedocs.patient_id';
    var v = sessionStorage.getItem(k);
    if (!v) {
      v = 'web-' + (crypto.randomUUID ? crypto.randomUUID().slice(0, 8)
                                      : Math.random().toString(16).slice(2, 10));
      sessionStorage.setItem(k, v);
    }
    return v;
  }

  function el(tag, cls, text) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (text != null) d.textContent = text;
    return d;
  }

  function scroll() { msgs.scrollTop = msgs.scrollHeight; }

  function showEmergency() {
    $('emergency').classList.add('show');
  }

  function addAgent(text, opts) {
    opts = opts || {};
    var row = el('div', 'row agent' + (opts.emergency ? ' emergency' : ''));
    var box = el('div', 'bubble');
    box.appendChild(el('div', 'who', '导诊助手'));
    box.appendChild(el('div', null, text));
    if (opts.citations && opts.citations.length) {
      var c = el('div', 'cites');
      c.appendChild(el('div', null, '依据（仅供核对）：'));
      opts.citations.forEach(function (x) {
        var a = el('a', null, x.title || ('来源 ' + x.index));
        a.href = x.source_url; a.target = '_blank'; a.rel = 'noopener noreferrer';
        var line = el('div');
        line.appendChild(el('span', null, '[' + x.index + '] '));
        line.appendChild(a);
        c.appendChild(line);
      });
      box.appendChild(c);
    }
    row.appendChild(box);
    msgs.appendChild(row);
    scroll();
    return box;
  }

  function addMe(text) {
    var row = el('div', 'row me');
    row.appendChild(el('div', 'bubble', text));
    msgs.appendChild(row);
    scroll();
  }

  function addStatus(text) {
    var row = el('div', 'row agent');
    var s = el('div', 'status');
    s.appendChild(el('span', 'dots', text));
    row.appendChild(s);
    msgs.appendChild(row);
    scroll();
    return row;
  }

  function setHint(on) { $('hintAnswer').classList.toggle('show', !!on); }

  function reset() {
    threadId = null;
    msgs.innerHTML = '';
    $('emergency').classList.remove('show');
    setHint(false);
    addAgent(GREETING);
    input.value = '';
    input.style.height = 'auto';
    input.focus();
  }

  function parseSSE(block) {
    var ev = 'message', data = '';
    block.split('\n').forEach(function (line) {
      if (line.indexOf('event:') === 0) ev = line.slice(6).trim();
      else if (line.indexOf('data:') === 0) data += line.slice(5).trim();
    });
    if (!data) return null;
    try { return { ev: ev, obj: JSON.parse(data) }; } catch (e) { return null; }
  }

  async function send() {
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';
    setHint(false);
    addMe(text);

    var statusRow = addStatus('正在思考');
    var botBox = null;
    $('btnSend').disabled = true;
    $('btnStop').disabled = false;
    ctrl = new AbortController();

    var body = { message: text, patient_id: patientId() };
    if (threadId) body.thread_id = threadId;

    function replaceStatus(text) {
      statusRow.innerHTML = '';
      var s = el('div', 'status');
      s.appendChild(el('span', 'dots', text));
      statusRow.appendChild(s);
      scroll();
    }

    try {
      var resp = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        signal: ctrl.signal,
      });
      if (!resp.ok) {
        // 对患者只给一句人话；细节留在控制台给运维看。
        console.error('chat failed', resp.status, await resp.text());
        statusRow.remove();
        addAgent('服务暂时不可用，请稍后再试。如果情况紧急，请直接拨打 120。');
        return;
      }
      var reader = resp.body.getReader(), dec = new TextDecoder(), buf = '';
      for (;;) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buf += dec.decode(chunk.value, { stream: true });
        var blocks = buf.split('\n\n');
        buf = blocks.pop();
        for (var i = 0; i < blocks.length; i++) {
          var ev = parseSSE(blocks[i]);
          if (!ev) continue;
          if (ev.ev === 'thread') {
            threadId = ev.obj.thread_id || threadId;
          } else if (ev.ev === 'tool') {
            replaceStatus(TOOL_TEXT[ev.obj.tool] || GENERIC_TOOL_TEXT);
          } else if (ev.ev === 'message') {
            var o = ev.obj;
            statusRow.remove();
            botBox = addAgent(o.text || '（没有收到回复，请换一种说法再试一次。）', {
              emergency: o.status === 'emergency',
              citations: o.citations,
            });
            if (o.status === 'emergency') showEmergency();
            setHint(!!o.awaiting_user);
            if (o.awaiting_user) input.focus();
          } else if (ev.ev === 'error') {
            console.error('chat stream error', ev.obj.error);
            statusRow.remove();
            addAgent('这次没能处理完，请再试一次。如果情况紧急，请直接拨打 120。');
          }
        }
      }
    } catch (e) {
      if (e.name === 'AbortError') {
        if (statusRow.parentNode) statusRow.remove();
        if (!botBox) addAgent('（已停止）');
      } else {
        console.error(e);
        if (statusRow.parentNode) statusRow.remove();
        addAgent('网络连接中断了，请检查网络后重试。如果情况紧急，请直接拨打 120。');
      }
    } finally {
      if (statusRow.parentNode) statusRow.remove();
      $('btnSend').disabled = false;
      $('btnStop').disabled = true;
      ctrl = null;
    }
  }

  $('btnSend').addEventListener('click', send);
  $('btnStop').addEventListener('click', function () { if (ctrl) ctrl.abort(); });
  $('btnNew').addEventListener('click', reset);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  // 输入框随内容长高（上限由 CSS 的 max-height 兜住）
  input.addEventListener('input', function () {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, Math.round(window.innerHeight * 0.4)) + 'px';
  });

  reset();
})();
</script>
</body>
</html>
