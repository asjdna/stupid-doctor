# 一条命令起全栈：db(ParadeDB/pg_search) + api
#
# 这里曾有 `cache`(redis:7.4) 与 `langfuse`(profile obs) 两个服务，本次删除：
#   · `cache`：pyproject 声明了 `redis` 依赖，但 **src/ scripts/ tests/ 里零处使用**
#     （`Settings.redis_url` 也没有读者）——一个没人连的容器只是噪声；
#   · `langfuse`：仓库没有任何 Langfuse 调用代码（也没有该依赖），
#     而项目真正实现的观测路径是 **OTel（console/otlp）+ Prometheus `/metrics`**，
#     它们都不需要这两个服务。
#
# ⚠️ 本文件的**运行**尚未在本机实测（`db` 服务只做过**等价演练**：同镜像 + 同卷 +
#    同 `-c shared_preload_libraries=pg_search`，跑在独立容器/独立端口上，见
#    docs/adr/0004 第十节；`docker compose up` 本身没跑，因为那会重建本机
#    已有的 `kubedocs-db-1`）。标记为「未完整验证」，不假装它能跑。
#
# 版本都**钉死**：工业项目里 "latest" 会让半年后的自己无法复现。

name: kubedocs

services:
  db:
    # 生产检索库：**ParadeDB 官方镜像** = Postgres 16 + pgvector + pg_search（真 BM25）。
    #
    # 为什么不再用 `pgvector/pgvector:pg16`：Postgres 核心只有 `ts_rank`（TF 加权，
    # 无 IDF、无文档长度归一化——**不是 BM25**），而关键字路的排序质量就靠 BM25。
    # 实测 hybrid hit@10：ts_rank 0.7400（低于冻结基线 0.8400）→ pg_search 0.8400
    # （见 docs/adr/0004 第十节，含原始命令与输出）。
    #
    # 版本钉死（不用 latest，理由与文件头一致）：
    #   · `0.26.1`：`USING paradedb` / `pdb.match_disjunction` / 表达式字段的 `alias=`
    #     / `pdb.chinese_compatible('stemmer=english')` 都是这一版实测出来的语法，
    #     换版本必须重跑 ADR 第十节那组数字；
    #   · `pg16`：本机 `dbdata` 卷是 PG16 初始化的，PG 主版本之间数据目录不兼容——
    #     换 PG17/18 就等于要求全量 dump/restore。
    #
    # 实测 2026-10-11：本镜像**沿用 pgvector:pg16 初始化的那个卷**起来后，
    # 18861 块一块不少、无需 dump/restore（演练明细见 ADR 第十节）。
    # ⚠️ 但本文件**没有**在 `kubedocs-db-1` 上跑过 `docker compose up -d db`
    #（那会重建这个容器，而它里面那份索引是有价值的资产）。上机前的第一步是：
    #   docker compose up -d db                                # 复用同一个卷
    #   docker compose exec db psql -U kubedocs -d kubedocs -c 'select count(*) from k8s_docs.chunks'
    # 换镜像后第一次构造 store 会自动补建 BM25 索引（幂等，见 PgVectorStore._setup_fts）。
    image: paradedb/paradedb:0.26.1-pg16
    # ⚠️ 这一行对**沿用已有数据目录**的场景是必需的：pg_search 是 preload 型扩展。
    # 镜像自带的 `postgresql.conf.sample` 里已经写了 `shared_preload_libraries=...`
    # （全新 initdb 因此自带，实测），但**已有数据目录用的是它自己那份 postgresql.conf**，
    # 那里面没有——实测 `CREATE EXTENSION pg_search` 会直接报
    # `pg_search must be loaded via shared_preload_libraries`。
    # 显式传 `-c` 覆盖，两种数据目录（新建 / 沿用）都能起来。
    # 代价：新库上会覆盖掉镜像默认的 `pg_cron,pg_stat_statements`——本仓库两处都没用
    #（连 CREATE EXTENSION 都没做过），所以是有意为之。
    command: ["postgres", "-c", "shared_preload_libraries=pg_search"]
    environment:
      POSTGRES_USER: kubedocs
      POSTGRES_PASSWORD: kubedocs
      POSTGRES_DB: kubedocs
      # 中文/英文混排的全文检索：这里语料是英文，BM25 侧的分词器固定为
      # `pdb.chinese_compatible('stemmer=english')`（英文 Snowball 词干 + 中文单字，
      # 见 src/kubedocs/store/pgvector_store.py 的模块文档）；换中文语料时靠
      # 应用层归一化器（KUBEDOCS_NORMALIZER=chinese）在入库/查询两侧切词。
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubedocs -d kubedocs"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # 容器内互访用服务名（.env 里的示例值就是按 compose 写的）
      KUBEDOCS_DATABASE_URL: postgresql://kubedocs:kubedocs@db:5432/kubedocs
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # 语料与模型缓存持久化：否则每次重建容器都要重下 16MB 语料 + 模型
      - ./data:/app/data
      - hfcache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx;httpx.get('http://127.0.0.1:8080/healthz',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  dbdata:
  hfcache:
