# 一条命令起全栈：db（Postgres + pgvector + pg_search）与 api。
#
# 两条使用路径互为并列：本机直跑（不需要 Docker）与 compose 全栈。
# 相关说明见 README 与 docs/ARCHITECTURE.md。
#
# 版本都钉死：不写 latest，否则半年后无法复现。

name: kubedocs

services:
  db:
    # Postgres 16 + pgvector + pg_search（真 BM25）。关键字检索路的排序质量依赖 BM25，
    # 而 Postgres 核心只有 ts_rank（无 IDF、无文档长度归一化），因此用这个镜像。
    # 版本钉死：不用 latest，半年后才复现得出来；主版本与已有数据目录绑定，不轻易更换。
    # 换镜像后首次构造 store 会自动补建 BM25 索引（幂等）。
    image: paradedb/paradedb:0.26.1-pg16
    # pg_search 是 preload 型扩展。镜像自带的 postgresql.conf.sample 已包含该配置，
    # 但**沿用已有数据目录**时用的是那份旧的 postgresql.conf，因此需要显式传入。
    # 代价是新库上会覆盖镜像默认的 pg_cron / pg_stat_statements，本仓库未使用它们。
    command: ["postgres", "-c", "shared_preload_libraries=pg_search"]
    environment:
      POSTGRES_USER: kubedocs
      POSTGRES_PASSWORD: kubedocs
      POSTGRES_DB: kubedocs
      # 全文检索的中文兼容分词：英文用 Snowball 词干，中文按单字切；
      # 中文语料另由应用层归一化器（KUBEDOCS_NORMALIZER=chinese）在入库与查询两侧切词。
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubedocs -d kubedocs"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 受限网络下可指定镜像源：
        #   export APT_MIRROR=mirrors.aliyun.com
        #   export PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
        # 留空则使用 Debian / PyPI 官方源。
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        # 可选：装 CPU 版 torch，镜像体积从约 10 GB 降到约 2.3 GB。
        # 两个变量必须一起给（只给 find-links 时 pip 仍会挑 CUDA 版）：
        #   export TORCH_CPU_FIND_LINKS=https://mirrors.aliyun.com/pytorch-wheels/cpu/
        #   export TORCH_CPU_VERSION=2.9.1+cpu
        TORCH_CPU_FIND_LINKS: ${TORCH_CPU_FIND_LINKS:-}
        TORCH_CPU_VERSION: ${TORCH_CPU_VERSION:-}
        # 置 1 时在 builder 阶段安装 build-essential 与 libpq-dev（默认不装，依赖都是 wheel）。
        BUILD_TOOLS: ${BUILD_TOOLS:-}
    env_file:
      - .env
    environment:
      # 显式钉住容器里用 Postgres：`.env` 里可能把 KUBEDOCS_STORE 设成了本地后端，
      # 而 compose 的 `environment` 优先于 `env_file`。写死 pgvector 才不会出现
      # "api 去读容器内的嵌入式索引、把旁边那个填满数据的 Postgres 晾着"。
      KUBEDOCS_STORE: pgvector
      # 容器内互访用服务名
      KUBEDOCS_DATABASE_URL: postgresql://kubedocs:kubedocs@db:5432/kubedocs
      # 必须显式给出挂载点：容器里包是安装进 venv 的，默认的仓库根推断会落到
      # venv 目录，导致 data/ 指向不存在的位置（表现为服务健康但检索为空）。
      KUBEDOCS_REPO_ROOT: /app
    # ⚠ **不再直接占宿主端口**：对外入口统一走下面的 `nginx`（见 deploy/nginx.conf）。
    # 这样 `docker compose up -d --scale api=3` 才能生效——每个副本都想绑 8080:8080
    # 会直接冲突。宿主机访问方式不变，仍是 http://127.0.0.1:8080。
    # 只想单副本、又不想用网关时，把下面两行注释放回去即可：
    # ports:
    #   - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # 语料与模型缓存持久化：避免每次重建容器都重下语料与模型。
      # 挂载点必须与 Dockerfile 的 HF_HOME 一致，且在非 root 用户可读的位置。
      - ./data:/app/data
      - hfcache:/home/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx;httpx.get('http://127.0.0.1:8080/healthz',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # 网关：唯一对外入口。三件事都由它负责（细节见 deploy/nginx.conf）：
  #   1. **sticky**：同一客户端固定到同一个 api 副本——待确认挂号单仍在进程内
  #      （一次性提议，`DECISIONS` 第 15 条），多副本下"在 A 提议、在 B 确认"会失败；
  #   2. **SSE 不缓冲**：`/chat` 是 `text/event-stream`，nginx 默认缓冲会把事件攒到最后；
  #   3. **读超时放大**：一轮问诊是模型在跑，默认 60s 会掐断长回答。
  # 副本数：`docker compose up -d --scale api=3`（后端地址由 nginx 的 `resolve` 动态解析）。
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      # 只探活网关自身（不依赖后端域名解析是否已经就绪）
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  dbdata:
  hfcache:
