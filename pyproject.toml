[build-system]
# setuptools>=77：PEP 639（SPDX 许可证表达式 `license = "MIT"` 与 `license-files`）
# 从 77.0.0 起才被 setuptools 接受；只写 >=68 会让 68-76 的构建环境直接报错。
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubedocs"
version = "0.1.0"
description = "双域（Kubernetes 文档 / 医疗问诊）RAG + agent 平台：混合检索 + 重排 + 带引用回答 + 工具编排 + 评测闸门 + 可观测"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    # Web / API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    # 配置与校验
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # 存储
    "psycopg[binary,pool]>=3.2",   # Postgres（pgvector + 全文检索都走它）
    "pgvector>=0.3",               # vector 类型适配
    # 这里曾有 `redis>=5.0`：全仓没有任何一行代码用它（`Settings.redis_url` 也没有读者），
    # 属于"声明了没人用的依赖"，已删除——连同 compose 里那个没人连的 redis 服务。
    # 要加缓存/限流时，再连同真实分支一起引回来。
    # 本地回退后端（KUBEDOCS_STORE=sqlite-vec）的向量表；默认后端是 pgvector。
    # 注意：vec0 是**穷举扫描**而非 ANN（实测在本项目 18861×384 上比 numpy 暴力慢约 11 倍），
    # 选它换的是「向量与块行同事务、可增删、不常驻内存」，不是延迟——见 docs/DECISIONS.md。
    "sqlite-vec>=0.1.9",
    # 模型
    "litellm>=1.50",               # 多供应商路由/重试/回退/成本统计
    "sentence-transformers>=3.0",  # 本地嵌入（可换成 API，见 embedder 抽象）
    "langgraph>=0.2",              # Agent 编排（耐久状态 + 中断）
    # 工具对外暴露（MCP = Model Context Protocol）：与 HTTP /tools 同一份工具注册表，
    # 走标准协议，外部客户端不必为每个工具写适配层。**必须显式声明**——
    # 它能作为传递依赖被装上，而"能用但没声明"是脆的。
    "mcp>=1.27",
    # 可观测：/metrics 用 prometheus_client；OTel 分三个分布包——
    # `opentelemetry-api` 才是 `observability.py` 里 `import opentelemetry` 的那个包
    # （sdk 依赖它，但"靠传递依赖装上"是脆的），sdk 建 provider，http exporter 走 OTLP。
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    # 杂项
    "httpx>=0.27",
    "orjson>=3.10",
    "tenacity>=8.5",
    # 下面三个**被 src/ 直接 import，但此前没有声明**，靠传递依赖凑巧可用。
    # 这是"开发环境看不见、真装才现形"的一类缺陷，实测撞过两次：
    #   · `jieba`：clinic 域的中文归一化器（`KUBEDOCS_NORMALIZER=chinese`）必需，
    #     而**没有任何已声明依赖会带上它** ⇒ 容器里 `ingest --domain clinic` 直接
    #     `ModuleNotFoundError: No module named 'jieba'`。宿主 venv 装了，所以本机永远看不见。
    #   · `numpy` / `python-dotenv`：分别是 sentence-transformers 与 litellm 的传递依赖，
    #     但我们在 `embed.py` / `ingest.py` / `store/base.py` / `config.py` 里**直接**用它们。
    # 与上面 `jieba` / `numpy` 同一条理由：能用但没声明是脆的，上游哪天不带了功能会静默消失。
    # 复现这道检查：`python scripts/check_deps.py`（`ci_local.py` 的 quality job 会跑它）。
    "jieba>=0.42",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    # 多格式解析（`parse.py`）：把 PDF / Office / HTML 也变成可检索的块，而不只认 `.md`。
    # 同样全部显式声明——这些解析库很容易以传递依赖的形式被装上（本机 venv 就是这样），
    # 而容器里 `pip install .` 之后会缺一个包、坏掉一种格式，且报错位置离原因很远。
    # 在 `parse.py` 里它们都是**函数内延迟 import**：缺一个库只坏这一种格式，
    # 不会让 `import kubedocs.ingest` 整体失败、连检索服务都起不来。
    "pypdf>=4.2",                # PDF 文本层
    "python-docx>=1.1",          # .docx
    "openpyxl>=3.1",             # .xlsx
    "python-pptx>=0.6.23",       # .pptx
    "beautifulsoup4>=4.12",      # .html
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",        # httpx 打桩
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
kubedocs = "kubedocs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# 系统提示词是**运行时要读的 `.md`**，默认不会进 wheel（setuptools 只带 `.py`），
# 于是 editable 安装（本机开发）一切正常，而 `pip install .` 装出来的包里没有它 ——
# **实测**：容器里新镜像的 `/consult` 直接报
# `FileNotFoundError: 系统提示词缺失：/opt/venv/lib/python3.10/site-packages/kubedocs/clinical/prompts/system.md`。
# 这是"开发环境看不见、真装才现形"的典型打包缺陷，所以显式声明。
# `src/` 下只有这一个非 `.py` 运行时文件（`git ls-files src | grep -v '\.py$'` 可核对）。
[tool.setuptools.package-data]
"kubedocs.clinical.prompts" = ["*.md"]

# ---------------------------------------------------------------------------
# 工具链：全部**阻塞**。风格类规则（导入排序、% 格式化）不在闸门内——
# 闸门只抓能造成真问题的规则。
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S", "C4", "RET", "SIM"]
ignore = [
    "E501",   # 行长由 formatter 决定
    "S101",   # 测试里用 assert 是正常的
    "B008",   # FastAPI 的 Depends() 默认参数是框架约定
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]   # 测试里的假口令/假 key

[tool.ruff.lint.isort]
known-first-party = ["kubedocs"]

[tool.ruff.format]
# 显式锁定 LF。开发机是 Windows（`core.autocrlf=true`）、部署与容器是 Linux：
# 不定死行尾，`ruff format --check` 的判定就依赖环境——一台机器说"已格式化"、
# 另一台说"待重排"，门禁会变成一个环境函数而不是代码质量的函数。
# 与 `.gitattributes` 的 `* text=auto eol=lf` 同向。
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
files = ["src", "scripts"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: 需要真实 Postgres/Redis（无 Docker 时自动跳过）",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/kubedocs"]
omit = ["*/tests/*"]
