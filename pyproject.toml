[build-system]
# setuptools>=77：PEP 639（SPDX 许可证表达式 `license = "MIT"` 与 `license-files`）
# 从 77.0.0 起才被 setuptools 接受；只写 >=68 会让 68-76 的构建环境直接报错。
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubedocs"
version = "0.1.0"
description = "面向 Kubernetes 官方文档的工业级 RAG 服务：混合检索 + 重排 + 带引用回答 + 评测闸门 + 可观测"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    # Web / API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    # 配置与校验
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # 存储
    "psycopg[binary,pool]>=3.2",   # Postgres（pgvector + 全文检索都走它）
    "pgvector>=0.3",               # vector 类型适配
    # 这里曾有 `redis>=5.0`：全仓没有任何一行代码用它（`Settings.redis_url` 也没有读者），
    # 属于"声明了没人用的依赖"，已删除——连同 compose 里那个没人连的 redis 服务。
    # 要加缓存/限流时，再连同真实分支一起引回来。
    # 本地/CI 默认后端（KUBEDOCS_STORE=sqlite-vec）的向量表。
    # 注意：vec0 是**穷举扫描**而非 ANN（实测在本项目 18861×384 上比 numpy 暴力慢约 11 倍），
    # 选它换的是「向量与块行同事务、可增删、不常驻内存」，不是延迟——见 docs/adr/0004。
    "sqlite-vec>=0.1.9",
    # 模型
    "litellm>=1.50",               # 多供应商路由/重试/回退/成本统计
    "sentence-transformers>=3.0",  # 本地嵌入（可换成 API，见 embedder 抽象）
    "langgraph>=0.2",              # Agent 编排（耐久状态 + 中断）
    # 工具对外暴露（MCP = Model Context Protocol）。**显式声明**：
    # 它此前作为传递依赖存在（`import mcp` 能成功），而"能用但没声明"是脆的——
    # 上游哪天不带了，功能会静默消失。参考项目 Agent_In_Action 演示的就是这条路径。
    "mcp>=1.27",
    # 可观测
    # 这三个现在都有真实分支（见 observability.py）：/metrics 用 prometheus_client，
    # OTel 用 sdk + http exporter。此前它们是"声明了但没人 import"的依赖。
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    # 杂项
    "httpx>=0.27",
    "orjson>=3.10",
    "tenacity>=8.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",        # httpx 打桩
    "ruff>=0.6",
    "mypy>=1.11",
]
eval = [
    "ragas>=0.2",          # 行业口径的 RAG 指标（与自建闸门并存）
    "deepeval>=1.0",
]

[project.scripts]
kubedocs = "kubedocs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# 工具链：全部**阻塞**，与 CI 一致。风格类规则（导入排序、% 格式化）不在闸门内——
# 闸门只抓能造成真问题的规则。
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S", "C4", "RET", "SIM"]
ignore = [
    "E501",   # 行长由 formatter 决定
    "S101",   # 测试里用 assert 是正常的
    "B008",   # FastAPI 的 Depends() 默认参数是框架约定
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]   # 测试里的假口令/假 key

[tool.ruff.lint.isort]
known-first-party = ["kubedocs"]

[tool.ruff.format]
# 显式锁定 LF。开发机是 Windows（`core.autocrlf=true`）、CI 是 Linux：
# 不定死行尾，`ruff format --check` 的判定就依赖环境——本地"已格式化"、
# CI"待重排"（或反之），门禁会变成一个环境函数而不是代码质量的函数。
# 与 `.gitattributes` 的 `* text=auto eol=lf` 同向。
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
files = ["src", "scripts"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: 需要真实 Postgres/Redis（无 Docker 时自动跳过）",
    "slow: 需要加载嵌入模型或调用真实 LLM",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/kubedocs"]
omit = ["*/tests/*"]
